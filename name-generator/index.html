<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>

        </header>
        <section>
            <h1>Name Generator</h1>
            <label>Answer the questions and get five generated names, which you can mix together to make a cool Wu-tang name.</label>

            <label for="firstName">First name:</label>
            <input type="text" id="firstName" placeholder="enter first name" required>
    
            <label for="lastName">Last name:</label>
            <input type="text" id="lastName" placeholder="enter last name" required>

            <label for="age">Age:</label>
            <input type="number" id="age" placeholder="5, 34, 100" required>

            <label for="color">Favorite color:</label>
            <input type="text" id="color" placeholder="Blue, Green, White" required>

            <label for="season">Birth season:</label>
            <input type="number" id="season" placeholder="Winter, Fall, Spring" required>

            <button>get names</button>
            <h2></h2>
        </section>
        <script type="text/javascript" src="js/main.js"></script> 
    </body>
</html>
