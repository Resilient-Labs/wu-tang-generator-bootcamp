<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Name Generator</title>
</head>

<body>
    <h1>Name Generator</h1>
    <p>Answer the questions to generate a name</p>

    <label for="ageSelect">Select Your Age Group</label>
    <select name="" id="ageSelect">
        <option value="0">Select</option>
        <option value="1">Under 21</option>
        <option value="3">21-29</option>
        <option value="4">30-39</option>
        <option value="5">40-49</option>
        <option value="6">50+</option>
    </select>

    <br>
    <label for="colorSelect">Select a Color</label>
    <select name="" id="colorSelect">
        <option value="0">Select</option>
        <option value="Red">Red</option>
        <option value="Blue">Blue</option>
        <option value="Yellow">Yellow</option>
        <option value="Green">Green</option>
        <option value="Purple">Purple</option>
        <option value="Orange">Orange</option>
    </select>
    <br>
    <label for="continentSelect">Select Your Location</label>
    <select name="" id="continentSelect">
        <option value="0">Select</option>
        <option value="Asia">Asia</option>
        <option value="Africa">Africa</option>
        <option value="North America">North America</option>
        <option value="South America">South America</option>
        <option value="Antarctica">Antarctica</option>
        <option value="Europe">Europe</option>
        <option value="Australia">Australia</option>
    </select>

    <br>

    <label for="animalSelect">Select a Pet</label>
    <select name="" id="animalSelect">
        <option value="0">Select</option>
        <option value="Dog">Dog</option>
        <option value="Cat">Cat</option>
        <option value="Other">Other</option>
        <option value="None">None</option>
    </select>
    <br>

    <label for="numberSelect">Select a Number Between 1-10</label>
    <select name="" id="numberSelect">
        <option value="0">Select</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
    </select>
    <br>
    <br>

    <button id="generateButton">Generate Name</button>
    <h1>Generated Name</h1>
    <h2 id="wuTangName"></h2>
</body>
<script src="wutangjs.js"></script>

</html>
