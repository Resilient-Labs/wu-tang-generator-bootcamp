<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu-Tang Name Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Wu-Tang Clan Name Generator</h1>
    <form id="name-generator-form">
        <label for="color">Favorite color:</label>
        <input type="text" id="color" required>

        <label for="number">Pick a number between 1 and 10:</label>
        <input type="number" id="number" min="1" max="10" required>

        <label for="day">Favorite day of the week:</label>
        <input type="text" id="day" required>

        <label for="animal">Favorite animal:</label>
        <input type="text" id="animal" required>

        <label for="adjective">Favorite adjective:</label>
        <input type="text" id="adjective" required>

        <button type="submit">Generate Name</button>
    </form>

    <h2>Your Wu-Tang Clan Name:</h2>
    <p id="result"></p>

    <script src="js/main.js"></script>
</body>
</html>
