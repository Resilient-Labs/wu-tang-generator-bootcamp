<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/theme-default.css">
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <main class="false-shadow solid-shadow">
      <section>
        <h1>Wu-Tang Name Generator</h1>
        <input id="name-input" type="text">
        <label>Favorite Color: <select id="color-select">
          <option value="">--select an option--</option>
          <option value="red">Red</option>
          <option value="green">Green</option>
          <option value="blue">Blue</option>
        </select></label>
        <label>Favorite Animal: <select id="animal-select">
          <option value="">--select an option--</option>
          <option value="dog">Dog</option>
          <option value="cat">Cat</option>
          <option value="fish">Fish</option>
        </select></label>
        <label>Favorite Fruit: <select id="fruit-select">
          <option value="">--select an option--</option>
          <option value="apple">Apple</option>
          <option value="banana">Banana</option>
          <option value="grapes">Grapes</option>
        </select></label>
        <label>Favorite Geometric Shape: <select id="shape-select">
          <option value="">--select an option--</option>
          <option value="square">Square</option>
          <option value="triangle">Triangle</option>
          <option value="circle">Circle</option>
        </select></label>
        <button id="results-button" class="false-shadow line-shadow clickable"><span>Get Results!</span></button>
        <h2><label>Your New Legal Name: <span id="new-name"></span></label></h2>
      </section>
    </main>
    <script type="text/javascript" src="/js/main.js"></script>
  </body>
</html>
