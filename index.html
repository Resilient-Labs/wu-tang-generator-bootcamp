<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Wu-Tang-Clan</title>
</head>

<body>
    <h1>Wu-Tang-Clan Name Generator</h1>
    <form>
        <div id="name">
            <h2>What is your name?</h2>
            <input type="text" name="" id="" placeholder="First Name" required>
        </div>
        <div id="age">
            <h2>How old are you?</h2>
            <label><input type="radio" name="age" value="option-1" id="" required>>18</label>
            <label><input type="radio" name="age" value="option-2" id="">18 - 25</label>
            <label><input type="radio" name="age" value="option-3" id="">26 -35</label>
            <label><input type="radio" name="age" value="option-4" id="">35+</label>
        </div>

        <div id="gender">
            <h2>Select Gender:</h2>

            <label>
                <input type="radio" name="gender" value="male" required>
                Male
            </label>

            <label>
                <input type="radio" name="gender" value="female">
                Female
            </label>
        </div>


        <div id="hobby">
            <h2>What is your favorite hobby?</h2>
            <label><input type="radio" name="hobby" value="sports" id="" required>Sports</label>
            <label><input type="radio" name="hobby" value="reading" id="">Reading</label>
            <label><input type="radio" name="hobby" value="art" id="">Art</label>
            <label><input type="radio" name="hobby" value="music" id="">Music</label>
        </div>
        <div id="pockets">
            <h2>How much bread you got?</h2>
            <label><input type="radio" name="pockets" value="option-1" id="" required>>10K</label>
            <label><input type="radio" name="pockets" value="option-2" id="">10k - 30k</label>
            <label><input type="radio" name="pockets" value="option-3" id="">30k - 100k</label>
            <label><input type="radio" name="pockets" value="option-4" id=""> 100K+</label>
        </div>
    </form>
    <section>
        <button class="button">Get your name!</button>
        <button class="button" id="clear">reset</button>
    </section>
    <p></p>
    <script type="text/javascript" src="js/main.js"></script>
</body>

</html>
