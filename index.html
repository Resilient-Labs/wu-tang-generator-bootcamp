<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Wu-Tang Name Generator</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <h1>Wu-Tang Name Generator</h1>

    <div class="quiz-container">
        <p>Favorite Color</p>
        <div class="options">
            <label><input type="radio" name="q1" value="green" /> Green</label>
            <label><input type="radio" name="q1" value="blue" /> Blue</label>
            <label><input type="radio" name="q1" value="red" /> Red</label>
        </div>

        <p>Favorite Activity</p>
        <div class="options">
            <label><input type="radio" name="q2" value="sleep" /> Sleep</label>
            <label><input type="radio" name="q2" value="exercise" /> Exercise</label>
            <label><input type="radio" name="q2" value="movie" /> Watch a Movie</label>
        </div>

        <p>Favorite Meal</p>
        <div class="options">
            <label><input type="radio" name="q3" value="breakfast" /> Breakfast</label>
            <label><input type="radio" name="q3" value="lunch" /> Lunch</label>
            <label><input type="radio" name="q3" value="dinner" /> Dinner</label>
        </div>

        <p>Favorite Animal</p>
        <div class="options">
            <label><input type="radio" name="q4" value="bird" /> Bird</label>
            <label><input type="radio" name="q4" value="whale" /> Whale</label>
            <label><input type="radio" name="q4" value="turtle" /> Turtle</label>
        </div>

        <p>Favorite Emotion</p>
        <div class="options">
            <label><input type="radio" name="q5" value="anger" /> Anger</label>
            <label><input type="radio" name="q5" value="love" /> Love</label>
            <label><input type="radio" name="q5" value="joy" /> Joy</label>
        </div>
    </div>

    <div class="actions">
        <button class="btn" type="button" id="submit-btn">Submit</button>
        <input type="text" class="result-display" id="output-name" placeholder="Here Is Your Name" readonly />
    </div>

    <script type="text/javascript" src="/js/main.js"></script>
</body>
</html>
