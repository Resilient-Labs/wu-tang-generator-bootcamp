<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/wuTang.css">
    <title>Wu-Tang Name Generator</title>
</head>
<body>
    <header>
        <h1>Wu-Tang Name Generator</h1>
        <p class="intro">Your choices below will determine your Wu-Tang name.</p>
    </header>

    <main class="container">
        <section class="surQuestion">
            <h2>What's your favorite sport?</h2>
            <label><input class="choices" type="radio" name="q1" value="a">Basketball</label>
            <label><input class="choices" type="radio" name="q1" value="b">Football - Not American</label>
            <label><input class="choices" type="radio" name="q1" value="c">Baseball</label>
        </section>

        <section class="surQuestion">
            <h2>Pick your favorite cuisine</h2>
            <label><input class="choices" type="radio" name="q2" value="a">Asian</label>
            <label><input class="choices" type="radio" name="q2" value="b">Carribean</label>
            <label><input class="choices" type="radio" name="q2" value="c">European</label>
        </section>

        <section class="surQuestion">
            <h2>Fashion Style</h2>
            <label><input class="choices" type="radio" name="q3" value="a">Street Wear</label>
            <label><input class="choices" type="radio" name="q3" value="b">Formal</label>
            <label><input class="choices" type="radio" name="q3" value="c">Smart Casual/Casual</label>
        </section>

        <section class="surQuestion">
            <h2>Favorite Tv Show Genre</h2>
            <label><input class="choices" type="radio" name="q4" value="a">Sci-Fi</label>
            <label><input class="choices" type="radio" name="q4" value="b">Anime</label>
            <label><input class="choices" type="radio" name="q4" value="c">True Crime</label>
        </section>

        <section class="surQuestion">
            <h2>Pet You Are Willing To Have</h2>
            <label><input class="choices" type="radio" name="q5" value="a">Fish</label>
            <label><input class="choices" type="radio" name="q5" value="b">cats</label>
            <label><input class="choices" type="radio" name="q5" value="c">Dog</label>
        </section>

        <section class="generate">
            <button id="generate" type="button">Welcome Young Wu-Tang</button>
        </section>

        <section class="resultBox">
            <h2>You Really Are Who??</h2>
            <h3 id="result"></h3>
        </section>

    </main>
    <script src="js/wuTang.js"></script>
</body>
</html>
