<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>Wu-Tang Name Generator</h1>
<form action="">

<p>Answer the questions to discover your Wu-Tang name</p>
<section>
    <h2>What kind of music are you choosing?</h2>
    <input type="radio" name="music" id="hiphop" value="hiphop">
        <label for="hiphop">Hip-Hop</label>
    <input type="radio" name="music" id="rnb" value="rnb">
        <label for="rnb">R&B</label>
        <input type="radio" name="music" id="rock" value="rock">
            <label for="rock">Rock</label>
</section>
<section>
    <h2>Pick your ideal vacation:</h2>
    <input type="radio" name="vacation" id="beach" value="beach">
        <label for="beach">Relaxing on a tropical beach</label>
        <input type="radio" name="vacation" id="europe" value="europe">
            <label for="europe">Exploring museums in Europe</label>
        <input type="radio" name="vacation" id="pyramids" value="pyramids">
            <label for="pyramids">Seeing the pyramids</label>
</section>
   <section>
    <h2>Choose a superpower:</h2>
    <input type="radio" name="power" id="invisibility" value="invisibility">
        <label for="invisibility">Invisibility</label>
        <input type="radio" name="power" id="mindreading" value="mindreading">
            <label for="mindreading">Read people's minds</label>
        <input type="radio" name="power" id="telekinesis" value="telekinesis">
            <label for="telekinesis">Telekinesis</label>
        <input type="radio" name="power" id="flying" value="flying">
            <label for="flying">Flying</label>
</section>
  <section>
    <h2>Pick an ice cream flavor:</h2>
    <input type="radio" name="icecream" id="chocolate" value="chocolate">
        <label for="chocolate">Chocolate</label>
    <input type="radio" name="icecream" id="vanilla" value="vanilla">
        <label for="vanilla">Vanilla</label>
    <input type="radio" name="icecream" id="strawberry" value="strawberry">
        <label for="strawberry">Strawberry</label>
</section>
<section>
    <h2>How would your friends describe you?</h2>
    <input type="radio" name="personality" id="chill" value="chill">
        <label for="chill">Chill and laid-back</label>
    <input type="radio" name="personality" id="funny" value="funny">
        <label for="funny">Funny and playful</label>
    <input type="radio" name="personality" id="mysterious" value="mysterious">
        <label for="mysterious">Quiet and mysterious</label>
    <input type="radio" name="personality" id="bold" value="bold">
        <label for="bold">Bold and confident</label>
</section> 
<button type ="button" id ="generate-name">Get Name</button>
</form>
<h3>Your Wu-Tang name is <span id = "result"></span> </h3>
</main>
    <script src="js/main.js"></script>
</body>
</html>
