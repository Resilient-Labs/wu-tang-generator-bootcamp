<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Wu Tang Name Generator</title>
  </head>
  <body>
    <h1>Wu-Tang Name Generator</h1>

    <ol>
      <li>What's your spirit animal?
        <select id="animal">
          <option value="1" id="one">lion</option>
          <option value="2" id="two">falcon</option>
        </select>
      </li>

      <li>If your life was a movie, what genre would it be? 
        <select id="movie">
          <option value="1" id="one">romance</option>
          <option value="2" id="two">horror</option>
        </select> 
      </li>

      <li>If you were a snack, you'd be..
        <select id="snack">
          <option value="1" id="one">hot cheetos</option>
          <option value="2" id="two">sour patch kids</option>
        </select>
      </li>

      <li>How do you handle conflict?
        <select id="conflict">
          <option value="1" id="one">walk away</option>
          <option value="2" id="two">fight back</option>
        </select> 
      </li>

      <li>What's your greatest strength?
        <select id="strength">
          <option value="1" id="one">patience</option>
          <option value="2" id="two">determination</option>
        </select> 
      </li>

    </ol>
    <button id="button">Generate my name!</button>
    <h2 id="result"></h2>
  </body>
  <script src="app.js"></script>
</html>
