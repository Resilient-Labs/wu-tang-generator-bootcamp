<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wu Tang Name Generator" />
    <meta name="keywords" content="fun, name, generator," />

    <title>Wu Tang Name Generator</title>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Wu Tang Name Generator</h1>
    <form id="nameForm">
      <label for="color"
        >What's your favorite color?
        <input type="text" id="color" name="color" />
      </label>

      <label for="city"
        >What city do you love?
        <input type="text" id="city" name="city" />
      </label>

      <label for="letter"
        >What's your favorite letter?
        <input type="text" id="letter" name="letter" />
      </label>

      <div>
        <p>Size:</p>
        <input type="radio" id="big" name="size" value="big" />
        <label for="big">Big</label>
        <input type="radio" id="lil" name="size" value="lil" />
        <label for="lil">Small</label>
      </div>

      <label for="hobby"
        >What is your favorite hobby?
        <input type="text" id="hobby" name="hobby" />
      </label>

      <button type="submit">Submit</button>
    </form>

    <h2></h2>
    <script type="text/javascript" src="js/main.js"></script>
  </body>
</html>
