<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wu-Tang Name Generator</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="container">
    <h1>Wu-Tang Name Generator</h1>

    <form action="">
      <legend>
        <h2>Answer the Questions</h2>
      </legend>
      <fieldset>

        <h3 class="questions">What is your favorite hobby?</h3>
        <input id="q1" type="text">

        <h3 class="questions">Which holiday do you love?</h3>
        <input id="q2" type="text">

        <h3 class="questions">Who do you want to be when you grow up?</h3>
        <input id="q3" type="text">

        <h3 class="questions">How much money do you have in your wallet?</h3>
        <input id="q4" type="text">

        <h3 class="questions">What's your favortie color?</h3>
        <input id="q5" type="text">

      </fieldset>
      <button id="generateName" type="button" name="button">Generate Name</button>
    </form>

    <h2 id="result"></h2>

  </div>

  <script type="text/javascript" src="/js/main.js"></script>
</body>

</html>
