<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>WuTang Name Generator</title>
</head>
<body>
    <header>
        <h1>Wu-Tang Name Generator</h1>
    </header>
    <div>
    <section id="questionSection">
        <label for="name"></label>
        <input id="name" type="text" value="" placeholder="Name">

        <label for="gender">Gender</label>
        <select name="gender" id="gender">
            <option value="1">Male</option>
            <option value="2">Female</option>
            <option value="3">Non Binary</option>
            <option value="4">Other</option>
        </select>
        
        <label for="birthdayMonth">Birthday</label>
        <select name="birthdayMonth" id="birthdayMonth">
            <option value="1">January</option>
            <option value="1">February</option>
            <option value="1">March</option>
            <option value="2">April</option>
            <option value="2">May</option>
            <option value="2">June</option>
            <option value="3">July</option>
            <option value="3">August</option>
            <option value="3">September</option>
            <option value="4">October</option>
            <option value="4">November</option>
            <option value="4">December</option>
        </select>

        <label for="favColor">Favorite Color</label>
        <select name="favColor" id="favColor">
            <option value="1">Red</option>
            <option value="1">Blue</option>
            <option value="1">Green</option>
            <option value="2">Yellow</option>
            <option value="2">Purple</option>
            <option value="2">Orange</option>
            <option value="3">Black</option>
            <option value="3">White</option>
            <option value="3">Pink</option>
            <option value="4">Other</option>
        </select>

        <label for="favAlbum">Favorite Wu Tang Album</label>
        <select name="favAlbum" id="favAlbum">
            <option value="1">Enter the Wu-Tang</option>
            <option value="1">Wu-Tang Forever</option>
            <option value="2">The W</option>
            <option value="2">Iron Flag</option>
            <option value="3">8 Diagrams</option>
            <option value="3">A Better Tomorrow</option>
            <option value="4">Once Upon a Time in Shaolin</option>
        </select>

        <button id="btn">Generate Name</button>
    </section>
    <section id="nameRevealSection">
        <p id="nameReveal"></p> <span id="wuTangFirstName"></span> <span id="wuTangLastName"></span>
    </section>
    </div>
    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
