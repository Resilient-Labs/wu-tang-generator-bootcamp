<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu-Tang</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Wu-Tang Name</h1>
    <p>Answer these 5 questions to get your Wu-Tang name!</p>

    <form id="survey">
        <label>1. What is your favorite color?</label>
        <input type="text" id="color">

        <label>2. What is your favorite animal?</label>
        <input type="text" id="animal">

        <label>What is your favorite body part?</label>
        <input type="text" id="body">

        <label>4. What is your favorite drink?</label>
        <input type="text" id="drink">

        <label>5. What is your favorite number?</label>
        <input type="number" id="number">

        <button type="button" id="button">Generate Wu-Tang Name</button>
    </form>

    <h2 class="wuName">Your Wu-Tang Name is:</h2>
   

    <script src="main.js"></script>
</body>
</html>
