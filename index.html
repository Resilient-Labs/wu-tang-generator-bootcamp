<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="description" content="This is where your description goes">
    	<meta name="keywords" content="one, two, three">

		<title>Title in the tab</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		
			<h1>Wu-Tang Clan Name Generator</h1>



			<form id="nameForm">
				<label>1. What city were you born in?<br>
					<input type="text" name="city" required>
				</label>
		
				<label>2. What is your favorite type of weather?
					<input type="text" name="weather" required>
				</label>
		
				<label>3. What is a word your friends would use to describe you?
					<input type="text" name="personality" required>
				</label>
		
				<label>4. What is your go-to dance move or style?
					<input type="text" name="dance" required>
				</label>
		
				<label>5. Pick a weapon (real or made-up):
					<input type="text" name="weapon" required>
				</label>
		
				<button type="submit"> Generate My Wu-Tang Name </button>
			</form>
		
			<p id="result"> </p>
		
			<script src="js/main.js"></script>
	</body>
</html>
