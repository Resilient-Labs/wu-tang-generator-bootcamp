<!DOCTYPE html>
<html lang="en">
	<head>
  	<meta charset="utf-8">
  	<meta name="description" content="Wu-Tang Name Generator">
  	<meta name="keywords" content="Wu-Tang Clan, name-generator, game">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		
		<title>Wu-Tang Name Generator Project</title>

    <link rel="stylesheet" href="/css/style.css">
	</head>
<body>
<h1>Special Name Generator</h1>
<h2>Answer the following 5 questions to receive your special name!</h2>

<h3>Question 1</h3>
<p>What's your favorite food?</p>
<label><input class="choices" type="radio" name="number1" value="a">Pizza</label>
<label><input class="choices" type="radio" name="number1" value="b">Pasta</label>
<label><input class="choices" type="radio" name="number1" value="c">Chicken</label>

<h3>Question 2</h3>
<p>What's your favorite city?</p>
<label><input class="choices" type="radio" name="number2" value="a">Boston</label>
<label><input class="choices" type="radio" name="number2" value="b">Newyork</label>
<label><input class="choices" type="radio" name="number2" value="c">Philly</label>

<h3>Question 3</h3>
<p>What's your favorite color?</p>
<label><input class="choices" type="radio" name="number3" value="a">Blue</label>
<label><input class="choices" type="radio" name="number3" value="b">Green</label>
<label><input class="choices" type="radio" name="number3" value="c">Pink</label>

<h3>What's your favorite sport?</h3>
<p>Question number 4?</p>
<label><input class="choices" type="radio" name="number4" value="a">Basketball</label>
<label><input class="choices" type="radio" name="number4" value="b">Baseball</label>
<label><input class="choices" type="radio" name="number4" value="c">Soccer</label>

<h3>Question 5</h3>
<p>What's your favorite season?</p>
<label><input class="choices" type="radio" name="number5" value="a">Summer</label>
<label><input class="choices" type="radio" name="number5" value="b">Spring</label>
<label><input class="choices" type="radio" name="number5" value="c">Fall</label>

<button id="generate">Generate special name</button>

<h3 id="result"></h3>

	<script type="text/javascript" src="/js/main.js"></script>
	</body>
</html>
