<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="description" content="This is where your description goes">
    	<meta name="keywords" content="one, two, three">

		<title>Wu-Tang Name Generator</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
	</head>
	<body>
<!-- Vic: Make a form with multiple choice questions. 3 options for each 5 -->
<section id="gameBox">
<section class="container">
	<h1>Wu-Tang Name Generator</h1>
  
	<section class="multipleChoice">
	<h3>1. What city best describes your energy?</h3>	
	<input class="options" type="radio" id="oneA" name="a1" value="a"/>
	<label for="oneA">New York</label>
	<input class="options" type="radio" id="oneB" name="a1" value="b"/>
	<label for="oneB">Philly</label>
	<input class="options" type="radio" id="oneC" name="a1" value="c"/>
	<label for="oneC">Shaolin</label>
	</section>

	<section class="multipleChoice">
	<h3>2. What is your favorite color?</h3>
	<input class="options" type="radio" id="twoA" name="a2" value="a"/>
	<label for="twoA">Black</label>
	<input class="options" type="radio" id="twoB" name="a2" value="b"/>
	<label for="twoB">Yellow</label>
	<input class="options" type="radio" id="twoC" name="a2" value="c"/>
	<label for="twoC">Black n Yellow</label>
	</section>

	<section class="multipleChoice">
	<h3>3. Pick a shoe</h3>
	<input class="options" type="radio" id="threeA" name="a3" value="a"/>
	<label for="threeA">Black Air Forces</label>
	<input class="options" type="radio" id="threeB" name="a3" value="b"/>
	<label for="threeB">Reebok Classics</label>
	<input class="options" type="radio" id="threeC" name="a3" value="c"/>
	<label for="threeC">Timbs (any but boneless)</label>
	</section>

	<section class="multipleChoice">
	<h3>4. Who is your favorite member?</h3>
	<input class="options" type="radio" id="fourA" name="a4" value="a"/>
	<label for="fourA">Inspectah Deck</label>
	<input class="options" type="radio" id="fourB" name="a4" value="b"/>
	<label for="fourB">Method Man</label>
	<input class="options" type="radio" id="fourC" name="a4" value="c"/>
	<label for="fourC">RZA</label>
	</section>

	<section class="multipleChoice">
	<h3>5. Pick a post fame path</h3>
	<input class="options" type="radio" id="fiveA" name="a5" value="a"/>
	<label for="fiveA">Front of the pack: Rappin</label>
	<input class="options" type="radio" id="fiveB" name="a5" value="b"/>
	<label for="fiveB">In the cut behind the scenes:Scores, Directing, Producing</label>
	<input class="options" type="radio" id="fiveC" name="a5" value="c"/>
	<label for="fiveC">Out the Way: Fully Retired</label>
	</section>
</section>

	<button id="click">Your Shaolin Alias</button>
	<h2 id="result">Enter the Wu</h2>
</section>

		

		<script type="text/javascript" src="js/main.js"></script>
		
	</body>
</html>
