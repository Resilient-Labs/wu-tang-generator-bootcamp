<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Wu Tang Generator - Cal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Happy+Monkey&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Tektur:wght@400..900&family=Tiny5&family=Unkempt:wght@400;700&family=Zen+Dots&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css\style1.css">
  </head>
  <body>
    <main>

    <h1>Wu Tang Clan Name Generator!</h1>

    <label>Enter First Name:</label>
    <input id="firstName" type="text" placeholder="Enter First Name Here">

    <label>Enter Last Name:</label>
    <input id="lastName" type="text" placeholder="Enter Last Name Here">

    <label>Choose Season:</label>
    <select name="seasons" id="seasons">
        <option value="spring">Spring</option>
        <option value="summer">Summer</option>
        <option value="fall">Fall</option>
        <option value="winter">Winter</option>
    </select>

    <label>Choose Element:</label>
    <select name="elements" id="elements">
        <option value="fire">Fire</option>
        <option value="water">Water</option>
        <option value="earth">Earth</option>
        <option value="air">Air</option>
    </select>

    <label>Choose Color:</label>
    <select name="colors" id="colors">
        <option value="crimson">Red</option>
        <option value="ice">Blue</option>
        <option value="ivy">Green</option>
        <option value="golden">Yellow</option>
    </select>

    <button id="generateButton">Enter Clan</button>

    <h2 ID="wuTangName">Wu Tang Clan Name:</h2>


    <script type="text/javascript" src="js/main1.js"></script>
  </main>
  </body>
</html>
