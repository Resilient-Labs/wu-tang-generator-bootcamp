<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu-Tang Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="generator-container">
        <h1>Wu-Tang Name Generator</h1>
        <p>Enter your government name to reveal your true destiny.</p>
        
        <input type="text" id="realName" placeholder="Enter your name...">
        <button id="generateBtn">Bring the Ruckus</button>
        
        <div id="result" class="hidden">
            <span class="label">Your Wu-Tang Name is:</span>
            <h2 id="wuName"></h2>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
